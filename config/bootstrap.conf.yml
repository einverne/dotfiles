# bootstrap linux, macos
- defaults:
    link:
      relink: true
      force: true

# Setup zinit
- create:
    - ~/.zinit
    - ~/.tmux

- shell:
    - description: Clone zinit
      quiet: true
      command: |
        if cd ~/.zinit/bin;
        then git pull;
        else git clone https://github.com/zdharma-continuum/zinit.git ~/.zinit/bin; fi

# Setup tmux plugin manager
- shell:
    - description: Clone TPM
      quiet: true
      command: |
        if cd ~/.tmux/plugins/tpm;
        then git pull;
        else git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm; fi

# Change default shell to zsh
- shell:
    - description: Change default shell to zsh
      quiet: true
      command: |
        update_shell() {
          local shell_path;
          shell_path="$(command -v zsh)"
          # skip when zsh is missing or already the login shell, so reruns don't prompt for sudo
          [ -n "$shell_path" ] || { echo "zsh not found, skipping"; return 0; }
          [ "$(basename "$SHELL")" = zsh ] && return 0

          echo "Changing your shell to zsh ..."
          if ! grep -qx "$shell_path" /etc/shells; then
            echo "Adding '$shell_path' to /etc/shells"
            sudo sh -c "echo $shell_path >> /etc/shells"
          fi
          sudo chsh -s "$shell_path" "$USER"
        }

        update_shell

- create:
    - ~/.config/
    - ~/.claude/agents
    - ~/.claude/commands

# Link entries into ~/.claude rather than replacing the directory itself:
# ~/.claude also holds settings, sessions and local-only agents/commands,
# and the default force: true would delete all of it.
- link:
    ~/.config/espanso:
      if: '[ `uname` = Linux ]'
      path: espanso
    ~/.claude/agents/:
      glob: true
      path: claude/agents/*.md
    ~/.claude/commands/:
      glob: true
      path: claude/commands/*
